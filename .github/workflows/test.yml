name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GOPATH: ${{ github.workspace }}/.cache/go
      GOTOOLCHAIN: go1.27.1
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: make test
      - run: make test-integration
      - run: make build
      - if: runner.os != 'Windows'
        run: make test-terminal
      - if: runner.os == 'Linux'
        run: xvfb-run -a make test-desktop
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: make verify-repro
