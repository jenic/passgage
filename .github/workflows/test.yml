name: test
on: [push, pull_request]
permissions:
  contents: read
env:
  GOCACHE: ${{ github.workspace }}/.gocache
  GOMODCACHE: ${{ github.workspace }}/.gomodcache
  GOPATH: ${{ github.workspace }}/.cache/go
  GOTOOLCHAIN: go1.27.1
  CGO_ENABLED: '0'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Prepare vendored dependencies
        shell: bash
        run: |
          go mod download
          make verify
          go mod vendor
      - run: make test
      - run: make test-integration
      - run: make build
      - if: runner.os != 'Windows'
        run: make test-terminal
      - if: runner.os == 'Linux'
        run: xvfb-run -a make test-desktop
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Prepare vendored dependencies
        shell: bash
        run: |
          go mod download
          make verify
          go mod vendor
      - run: make verify-repro
