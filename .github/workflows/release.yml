name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOCACHE: ${{ github.workspace }}/.gocache
  GOMODCACHE: ${{ github.workspace }}/.gomodcache
  GOPATH: ${{ github.workspace }}/.cache/go
  GOTOOLCHAIN: go1.27.1
  CGO_ENABLED: '0'

jobs:
  validate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release.sh metadata >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Prepare vendored dependencies
        run: |
          go mod download
          make verify
          go mod vendor
      - run: make release-all VERSION="$RELEASE_TAG"
      - run: bash .github/scripts/release.sh check-assets dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifacts
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Sign and verify every release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh sign dist
      - name: Upload, verify, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release.sh publish dist
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
